<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" font-family="Fira Code, monospace">
  <defs>
    <linearGradient id="fg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
  </defs>

  <line x1="120" y1="66" x2="780" y2="66" stroke="#1d2743" stroke-width="2"/>
  <line x1="120" y1="66" x2="780" y2="66" stroke="url(#fg2)" stroke-width="2" stroke-dasharray="16 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.8s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(450,66)">
    <circle r="22" fill="none" stroke="#00e5ff" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#7c4dff" stroke-width="1" stroke-dasharray="4 9" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text y="9" text-anchor="middle" font-size="26">⭐
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="30" text-anchor="middle" font-size="18" fill="#aeb8d4">
    Thanks for stopping by!
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="112" text-anchor="middle" font-size="14" fill="#5a6b8c">
    OPX-Aminul · Android &amp; wireless security tools
  </text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#3d4a68">
    ⚡ Built with curiosity
  </text>
</svg>
