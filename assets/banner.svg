<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050c">
        <animate attributeName="stop-color" values="#04050c;#0b0f2a;#04050c" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0a1028"/>
      <stop offset="100%" stop-color="#04050c">
        <animate attributeName="stop-color" values="#04050c;#141033;#04050c" dur="12s" begin="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff5470;#00ffa3;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c4dff">
        <animate attributeName="stop-color" values="#7c4dff;#ff5470;#00ffa3;#00e5ff;#7c4dff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#00e5ff;#7c4dff;#ff5470;#00ffa3" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="auroraA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- drifting aurora blobs -->
  <circle cx="0" cy="0" r="380" fill="url(#auroraA)">
    <animateTransform attributeName="transform" type="translate" values="180,140; 1020,220; 180,140" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="360" fill="url(#auroraB)">
    <animateTransform attributeName="transform" type="translate" values="1000,120; 220,260; 1000,120" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="300" fill="url(#auroraC)">
    <animateTransform attributeName="transform" type="translate" values="600,300; 700,80; 600,300" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="100" r="1"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="90" r="1"><animate attributeName="opacity" values="0;0.8;0" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="50" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="1"><animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="45" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="95" r="1.2"><animate attributeName="opacity" values="0;0.9;0" dur="4.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="160" r="1"><animate attributeName="opacity" values="0;0.8;0" dur="3.6s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.2"><animate attributeName="opacity" values="0;0.9;0" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling code glyphs -->
  <g font-family="Fira Code, monospace" font-size="14" fill="#00e5ff">
    <text x="150" y="-20" opacity="0">01<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite"/></text>
    <text x="320" y="-20" opacity="0" fill="#7c4dff">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="9.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="9.5s" begin="1s" repeatCount="indefinite"/></text>
    <text x="520" y="-20" opacity="0" fill="#00ffa3">{..}<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="7.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7.5s" begin="2s" repeatCount="indefinite"/></text>
    <text x="720" y="-20" opacity="0" fill="#ff5470">$~<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="920" y="-20" opacity="0">10<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="8.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="8.5s" begin="3s" repeatCount="indefinite"/></text>
    <text x="1080" y="-20" opacity="0" fill="#7c4dff">##<animateTransform attributeName="transform" type="translate" values="0,0;0,420" dur="9s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="9s" begin="1.6s" repeatCount="indefinite"/></text>
  </g>

  <!-- rising particles -->
  <g>
    <circle cx="180" cy="380" r="3" fill="#00e5ff"><animate attributeName="cy" values="390;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="380" r="2" fill="#7c4dff"><animate attributeName="cy" values="390;-10" dur="8.5s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="380" r="3" fill="#00ffa3"><animate attributeName="cy" values="390;-10" dur="6.5s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="380" r="2" fill="#ff5470"><animate attributeName="cy" values="390;-10" dur="9s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="380" r="3" fill="#00e5ff"><animate attributeName="cy" values="390;-10" dur="7.6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.6s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="380" r="2" fill="#7c4dff"><animate attributeName="cy" values="390;-10" dur="8s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit rings behind name -->
  <g transform="translate(600,180)" opacity="0.9">
    <circle r="150" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="175" fill="none" stroke="#7c4dff" stroke-width="1" stroke-dasharray="6 12" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00e5ff" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0,-150 A150,150 0 1,1 -0.1,-150"/>
    </circle>
    <circle r="4" fill="#ff5470" filter="url(#glow)">
      <animateMotion dur="13s" repeatCount="indefinite" path="M0,175 A175,175 0 1,0 -0.1,175"/>
    </circle>
  </g>

  <!-- scanning line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00e5ff" opacity="0.25">
    <animate attributeName="y" values="-4;384;-4" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- greeting -->
  <text x="600" y="130" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#8a96b3" letter-spacing="6">
    HELLO WORLD, I AM
  </text>

  <!-- name with gradient sweep + glow pulse -->
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="900" fill="url(#titleGrad)" letter-spacing="4" filter="url(#glow)">
    OPX-Aminul
  </text>

  <!-- animated underline draw -->
  <rect x="330" y="228" width="540" height="5" rx="2.5" fill="url(#titleGrad)"/>

  <!-- roles always visible even if SMIL is disabled -->
  <g font-family="Fira Code, monospace" font-size="26" text-anchor="middle">
    <text x="600" y="272" fill="#00e5ff">Security Researcher  ·  AI Engineer  ·  Android Pentester</text>
    <!-- blinking terminal cursor -->
    <rect x="790" y="252" width="12" height="26" fill="#8a96b3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom wave -->
  <path d="M0,330 Q150,305 300,330 T600,330 T900,330 T1200,330 L1200,380 L0,380 Z" fill="#0a0f1e" opacity="0.9">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,330 Q150,305 300,330 T600,330 T900,330 T1200,330 L1200,380 L0,380 Z;
              M0,330 Q150,355 300,330 T600,330 T900,330 T1200,330 L1200,380 L0,380 Z;
              M0,330 Q150,305 300,330 T600,330 T900,330 T1200,330 L1200,380 L0,380 Z"/>
  </path>
</svg>
